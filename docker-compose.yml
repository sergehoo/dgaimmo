# ─────────────────────────────────────────────────────────────────
# docker-compose.yml — PRODUCTION DGA-IMO360 / MutuelleX
#
# Traefik tourne déjà sur le serveur. L'application rejoint :
#   - `proxy`              : réseau externe partagé avec Traefik
#   - `mutuellex_network`  : réseau interne DB/Redis/Celery/Django
#
# Pré-requis :
#   docker network create proxy
#   docker compose --env-file .env up -d --build --remove-orphans
#
# Si un ancien service `traefik` local existe encore, il faut le retirer une fois :
#   docker compose --env-file .env down --remove-orphans
#   docker stop dgaimmo-traefik-1 || true
# ─────────────────────────────────────────────────────────────────

x-logging: &logging_rotated
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-common-env: &common_env
  TZ: Africa/Abidjan
  TIME_ZONE: Africa/Abidjan
  DJANGO_SETTINGS_MODULE: config.settings
  DJANGO_ENV: prod
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?must be set}
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?must be set}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?must be set}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  USE_X_FORWARDED_HOST: "1"
  SECURE_SSL_REDIRECT: "1"
  SESSION_COOKIE_SECURE: "1"
  CSRF_COOKIE_SECURE: "1"
  SECURE_HSTS_SECONDS: "31536000"
  SECURE_HSTS_INCLUDE_SUBDOMAINS: "1"
  SECURE_HSTS_PRELOAD: "1"
  POSTGRES_ENGINE: django.contrib.gis.db.backends.postgis
  ENABLE_GIS: "1"
  POSTGRES_DB: ${POSTGRES_DB:-mutuellex}
  POSTGRES_USER: ${POSTGRES_USER:-mutuellex}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
  POSTGRES_HOST: mutuellex-postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://:${REDIS_PASSWORD:?must be set}@mutuellex-redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?must be set}@mutuellex-redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?must be set}@mutuellex-redis:6379/1
  AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-ollama}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  PYTHONUNBUFFERED: "1"

x-app: &django_app
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  image: ${MUTUELLEX_IMAGE:-mutuellex:latest}
  env_file: [.env]
  environment:
    <<: *common_env
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging: *logging_rotated

services:
  mutuellex-postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      TZ: Africa/Abidjan
      POSTGRES_DB: ${POSTGRES_DB:-mutuellex}
      POSTGRES_USER: ${POSTGRES_USER:-mutuellex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
    volumes:
      - mutuellex_pgdata:/var/lib/postgresql/data
    networks: [mutuellex_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
    logging: *logging_rotated
    cpus: "1.5"
    mem_limit: 1500m
    mem_reservation: 512m
    ulimits:
      nofile: 65535

  mutuellex-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?must be set}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "900 1"
      - --maxmemory
      - 768mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      TZ: Africa/Abidjan
      REDIS_PASSWORD: ${REDIS_PASSWORD:?must be set}
    volumes:
      - mutuellex_redisdata:/data
    networks: [mutuellex_network]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -a \"$$REDIS_PASSWORD\" ping | grep PONG >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
    logging: *logging_rotated
    cpus: "0.7"
    mem_limit: 512m
    mem_reservation: 256m
    ulimits:
      nofile: 65535

  mutuellex-web:
    <<: *django_app
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py collectstatic --noinput && exec gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers ${WEB_CONCURRENCY:-3} --timeout ${GUNICORN_TIMEOUT:-60}
    volumes:
      - mutuellex_media:/app/media:rw
      - mutuellex_static:/app/staticfiles:rw
      - mutuellex_logs:/app/logs:rw
    depends_on:
      mutuellex-postgres:
        condition: service_healthy
      mutuellex-redis:
        condition: service_healthy
    networks: [mutuellex_network, proxy]
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "-H",
          "Host: ${APP_DOMAIN:-localhost}",
          "-H",
          "X-Forwarded-Proto: https",
          "http://127.0.0.1:8000/healthz/"
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # Routeur auth: login + JWT/API auth, rate-limit serre anti brute-force.
      - traefik.http.routers.mutuellex-auth.rule=Host(`${APP_DOMAIN:?must be set}`) && (Path(`/connexion/`) || PathPrefix(`/api/v1/auth/`) || PathPrefix(`/accounts/`))
      - traefik.http.routers.mutuellex-auth.entrypoints=websecure
      - traefik.http.routers.mutuellex-auth.tls=true
      - traefik.http.routers.mutuellex-auth.tls.certresolver=lets
      - traefik.http.routers.mutuellex-auth.service=mutuellex-web-svc
      - traefik.http.routers.mutuellex-auth.middlewares=mutuellex-sec-headers@docker,mutuellex-compress@docker,mutuellex-rl-auth@docker
      - traefik.http.routers.mutuellex-auth.priority=300

      # Routeur applicatif: landing, console, admin, API, docs, static/media.
      - traefik.http.routers.mutuellex-web.rule=Host(`${APP_DOMAIN:?must be set}`)
      - traefik.http.routers.mutuellex-web.entrypoints=websecure
      - traefik.http.routers.mutuellex-web.tls=true
      - traefik.http.routers.mutuellex-web.tls.certresolver=lets
      - traefik.http.routers.mutuellex-web.service=mutuellex-web-svc
      - traefik.http.routers.mutuellex-web.middlewares=mutuellex-sec-headers@docker,mutuellex-compress@docker,mutuellex-rl@docker
      - traefik.http.routers.mutuellex-web.priority=100

      # Routeur HTTP: redirection propre vers HTTPS.
      - traefik.http.routers.mutuellex-web-http.rule=Host(`${APP_DOMAIN:?must be set}`)
      - traefik.http.routers.mutuellex-web-http.entrypoints=web
      - traefik.http.routers.mutuellex-web-http.middlewares=mutuellex-redirect-https@docker
      - traefik.http.routers.mutuellex-web-http.service=mutuellex-web-svc
      - traefik.http.routers.mutuellex-web-http.priority=10

      - traefik.http.services.mutuellex-web-svc.loadbalancer.server.port=8000
      - traefik.http.services.mutuellex-web-svc.loadbalancer.server.scheme=http

      # Middlewares partages.
      - traefik.http.middlewares.mutuellex-redirect-https.redirectscheme.scheme=https
      - traefik.http.middlewares.mutuellex-redirect-https.redirectscheme.permanent=true
      - traefik.http.middlewares.mutuellex-sec-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.mutuellex-sec-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.mutuellex-sec-headers.headers.stsPreload=true
      - traefik.http.middlewares.mutuellex-sec-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.mutuellex-sec-headers.headers.frameDeny=true
      - traefik.http.middlewares.mutuellex-sec-headers.headers.browserXssFilter=true
      - traefik.http.middlewares.mutuellex-sec-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.mutuellex-compress.compress=true
      - traefik.http.middlewares.mutuellex-rl.ratelimit.average=150
      - traefik.http.middlewares.mutuellex-rl.ratelimit.burst=250
      - traefik.http.middlewares.mutuellex-rl-auth.ratelimit.average=10
      - traefik.http.middlewares.mutuellex-rl-auth.ratelimit.burst=20
    cpus: "1.5"
    mem_limit: 1024m
    mem_reservation: 512m
    ulimits:
      nofile: 65535

  mutuellex-asgi:
    <<: *django_app
    command: >
      uvicorn config.asgi:application
      --host 0.0.0.0
      --port 8001
      --proxy-headers
      --forwarded-allow-ips "*"
    depends_on:
      mutuellex-web:
        condition: service_healthy
    networks: [mutuellex_network, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.mutuellex-ws.rule=Host(`${APP_DOMAIN:?must be set}`) && PathPrefix(`/ws/`)
      - traefik.http.routers.mutuellex-ws.entrypoints=websecure
      - traefik.http.routers.mutuellex-ws.tls=true
      - traefik.http.routers.mutuellex-ws.tls.certresolver=lets
      - traefik.http.routers.mutuellex-ws.service=mutuellex-ws-svc
      - traefik.http.routers.mutuellex-ws.middlewares=mutuellex-sec-headers@docker,mutuellex-compress@docker
      - traefik.http.routers.mutuellex-ws.priority=400
      - traefik.http.services.mutuellex-ws-svc.loadbalancer.server.port=8001
      - traefik.http.services.mutuellex-ws-svc.loadbalancer.server.scheme=http
    cpus: "0.7"
    mem_limit: 512m
    mem_reservation: 256m

  mutuellex-worker:
    <<: *django_app
    command: >
      celery -A config.celery worker
      -Q default,celery,notifications,reports
      --loglevel=${CELERY_LOG_LEVEL:-warning}
      --concurrency=${CELERY_CONCURRENCY:-2}
      --prefetch-multiplier=1
      -Ofair
      --max-tasks-per-child=200
      --without-gossip
      --without-mingle
    depends_on:
      mutuellex-postgres:
        condition: service_healthy
      mutuellex-redis:
        condition: service_healthy
      mutuellex-web:
        condition: service_healthy
    networks: [mutuellex_network]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery inspect ping -d celery@$$HOSTNAME >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s
    cpus: "1.0"
    mem_limit: 768m
    mem_reservation: 384m
    ulimits:
      nofile: 65535

  mutuellex-beat:
    <<: *django_app
    command: celery -A config.celery beat --loglevel=${CELERY_LOG_LEVEL:-warning} --pidfile=/tmp/celerybeat.pid
    depends_on:
      mutuellex-postgres:
        condition: service_healthy
      mutuellex-redis:
        condition: service_healthy
      mutuellex-web:
        condition: service_healthy
    networks: [mutuellex_network]
    tmpfs:
      - /tmp:size=64m,mode=1777
    cpus: "0.3"
    mem_limit: 256m
    mem_reservation: 128m

  mutuellex-flower:
    <<: *django_app
    command: celery -A config.celery flower --port=5555 --basic_auth=${FLOWER_BASIC_AUTH:-admin:change-me}
    depends_on:
      mutuellex-redis:
        condition: service_healthy
      mutuellex-worker:
        condition: service_started
    networks: [mutuellex_network, proxy]
    profiles: ["monitoring"]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.mutuellex-flower.rule=Host(`${FLOWER_DOMAIN:-flower.localhost}`)
      - traefik.http.routers.mutuellex-flower.entrypoints=websecure
      - traefik.http.routers.mutuellex-flower.tls=true
      - traefik.http.routers.mutuellex-flower.tls.certresolver=lets
      - traefik.http.routers.mutuellex-flower.service=mutuellex-flower-svc
      - traefik.http.routers.mutuellex-flower.middlewares=mutuellex-sec-headers@docker,mutuellex-compress@docker,mutuellex-rl-auth@docker
      - traefik.http.routers.mutuellex-flower.priority=100
      - traefik.http.services.mutuellex-flower-svc.loadbalancer.server.port=5555
      - traefik.http.services.mutuellex-flower-svc.loadbalancer.server.scheme=http
    cpus: "0.3"
    mem_limit: 256m
    mem_reservation: 128m

  mutuellex-manage:
    <<: *django_app
    command: sleep infinity
    profiles: ["manage"]
    depends_on:
      mutuellex-postgres:
        condition: service_healthy
      mutuellex-redis:
        condition: service_healthy
    networks: [mutuellex_network]
    volumes:
      - .:/app:rw
      - mutuellex_media:/app/media:rw
      - mutuellex_static:/app/staticfiles:rw
      - mutuellex_logs:/app/logs:rw

volumes:
  mutuellex_pgdata:
  mutuellex_redisdata:
  mutuellex_media:
  mutuellex_static:
  mutuellex_logs:

networks:
  mutuellex_network:
    name: mutuellex_network
  proxy:
    external: true
