{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>DGAMUTUELLE</title>
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
          },
          colors: {
            mx: {
              lime: '#caff3d',
              lavender: '#c7d0ff',
              pale: '#f1ffd0',
              ink: '#090a10',
              muted: '#6b7280',
              shell: '#f3f3f5'
            }
          },
          boxShadow: {
            panel: '0 16px 42px rgba(17, 24, 39, 0.055)',
            shell: '0 28px 88px rgba(17, 24, 39, 0.15)'
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6 Free (icônes premium pour la landing + console) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
  <style>[x-cloak]{display:none!important}</style>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen overflow-x-hidden bg-[#d8d8de] text-mx-ink antialiased">
  {% block content %}{% endblock %}
</body>
</html>
