{% load static %}
<div x-data="{ tab: '{{ active_tab|default:"dashboard" }}' }" class="min-h-screen bg-[#f8fbff] text-[#06194a]">
  <header class="sticky top-0 z-30 border-b border-[#e8eef8] bg-white/92 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-[1440px] items-center justify-between px-5">
      <a href="/" class="flex items-center gap-2 no-underline">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-[#eef6ff] text-xl">⌂</span>
        <span class="text-xl font-black text-[#06337d]">DGA-IMO<span class="text-[#0aa25f]">360</span></span>
      </a>
      <nav class="hidden items-center gap-1 text-sm font-extrabold text-[#172b5f] lg:flex">
        <a class="rounded-lg px-4 py-2 {% if active_tab == 'dashboard' %}bg-[#eaf2ff] text-[#0b55d9]{% endif %}" href="{% url 'dashboard-home' %}">Tableau de bord</a>
        <a class="rounded-lg px-4 py-2 {% if active_tab == 'mutuelles' %}bg-[#eaf2ff] text-[#0b55d9]{% endif %}" href="{% url 'mutuelles-list' %}">Mutuelles</a>
        <a class="rounded-lg px-4 py-2" href="#">Projets</a>
        <a class="rounded-lg px-4 py-2" href="#">Membres</a>
        <a class="rounded-lg px-4 py-2" href="#">Simulations</a>
        <a class="rounded-lg px-4 py-2" href="#">Documents</a>
      </nav>
      <div class="flex items-center gap-3">
        <span class="relative hidden h-9 w-9 place-items-center rounded-full bg-[#f3f7ff] sm:grid">⌕<i class="absolute right-1 top-1 h-2 w-2 rounded-full bg-red-500"></i></span>
        <span class="hidden h-9 w-9 place-items-center rounded-full bg-[#f3f7ff] sm:grid">🔔</span>
        <div class="flex items-center gap-2 rounded-full bg-[#f3f7ff] px-2 py-1">
          <span class="grid h-8 w-8 place-items-center rounded-full bg-[#0b55d9] text-xs font-black text-white">JK</span>
          <span class="hidden text-xs font-extrabold md:block">John K.</span>
        </div>
      </div>
    </div>
  </header>
  <main class="mx-auto max-w-[1440px] px-5 py-8">
    {{ slot }}
  </main>
</div>
