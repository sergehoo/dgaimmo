{% extends "base/app.html" %}
{% load static %}
{% block content %}
<div class="relative min-h-screen overflow-hidden bg-[#f7fbff] text-[#06194a]">
  <div class="pointer-events-none absolute inset-x-0 top-0 h-[360px] bg-[linear-gradient(135deg,#eef5ff_0%,#ffffff_48%,#e9fff3_100%)]"></div>
  <div class="relative mx-auto flex min-h-screen max-w-[560px] items-center px-4 py-10">
    <div class="w-full rounded-[32px] border border-white/80 bg-white/95 p-10 text-center shadow-2xl shadow-blue-950/10 backdrop-blur">
      <a href="{% url 'landing-page' %}" class="inline-flex items-center gap-3 no-underline">
        <img src="{% static 'img/logoDGAmutuelle.png' %}" alt="DGA Mutuelle" width="180" class="h-auto">
      </a>

      <span class="mx-auto mt-8 grid h-20 w-20 place-items-center rounded-3xl bg-[#e8fff2] text-4xl text-[#0aa25f]"><i class="fa-solid fa-circle-check"></i></span>
      <h1 class="mt-6 text-3xl font-black">Mot de passe mis à jour</h1>
      <p class="mt-3 text-sm font-bold leading-6 text-[#536484]">Votre nouveau mot de passe a été enregistré. Vous pouvez désormais vous connecter à votre espace.</p>

      <a href="{% url 'login' %}" class="mt-8 inline-flex items-center gap-2 rounded-2xl bg-[#003b98] px-6 py-3 text-sm font-black text-white no-underline shadow-lg shadow-blue-900/20"><i class="fa-solid fa-right-to-bracket"></i> Se connecter</a>
    </div>
  </div>
</div>
{% endblock %}
